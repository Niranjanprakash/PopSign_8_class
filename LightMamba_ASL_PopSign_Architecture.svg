<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">LightMamba-ASL PopSign Architecture</title>
  <desc id="desc">A multimodal ASL recognition pipeline using RGB features and MediaPipe Holistic landmarks, reliability-aware fusion, hierarchical temporal modeling, and a four-class classifier.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091526"/>
      <stop offset="1" stop-color="#14223b"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1463d6"/>
      <stop offset="1" stop-color="#35a7ff"/>
    </linearGradient>
    <linearGradient id="landmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b907b"/>
      <stop offset="1" stop-color="#34c6a0"/>
    </linearGradient>
    <linearGradient id="fusion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a42c7"/>
      <stop offset="1" stop-color="#ca72eb"/>
    </linearGradient>
    <linearGradient id="temporal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e27722"/>
      <stop offset="1" stop-color="#f7bd4f"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ba3051"/>
      <stop offset="1" stop-color="#ef6d7a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a9bdd8"/>
    </marker>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #b7c8df; }
      .section { font: 700 16px Arial, sans-serif; fill: #80a8df; letter-spacing: 2px; }
      .box-title { font: 700 23px Arial, sans-serif; fill: #ffffff; }
      .box-body { font: 400 17px Arial, sans-serif; fill: #edf5ff; }
      .box-small { font: 400 15px Arial, sans-serif; fill: #dbeaff; }
      .foot { font: 400 16px Arial, sans-serif; fill: #afc1d8; }
      .line { stroke: #a9bdd8; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6583aa; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="180" fill="#205798" opacity="0.14"/>
  <circle cx="115" cy="950" r="200" fill="#8d4dc1" opacity="0.10"/>

  <text x="800" y="66" text-anchor="middle" class="title">LightMamba-ASL: PopSign Multimodal Recognition Architecture</text>
  <text x="800" y="100" text-anchor="middle" class="subtitle">Deployed model: 4 ASL signs - after, airplane, bird, cloud</text>

  <text x="95" y="165" class="section">VIDEO INPUT</text>
  <rect x="70" y="185" width="300" height="140" rx="22" fill="#1b304d" stroke="#5e8cc3" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="235" text-anchor="middle" class="box-title">Webcam or MP4 Video</text>
  <text x="220" y="268" text-anchor="middle" class="box-body">Complete dynamic ASL gesture</text>
  <text x="220" y="296" text-anchor="middle" class="box-small">Good lighting + face + hands in frame</text>

  <path d="M370 255 H450" class="line"/>
  <text x="390" y="225" text-anchor="middle" class="box-small">decode</text>

  <rect x="450" y="185" width="285" height="140" rx="22" fill="#263a57" stroke="#7895b9" stroke-width="2" filter="url(#shadow)"/>
  <text x="592" y="235" text-anchor="middle" class="box-title">Frame Sampler</text>
  <text x="592" y="268" text-anchor="middle" class="box-body">Uniform temporal sampling</text>
  <text x="592" y="296" text-anchor="middle" class="box-small">T = 32 RGB frames at 224 x 224</text>

  <path d="M592 325 V395 H390 V450" class="line"/>
  <path d="M592 325 V395 H1010 V450" class="line"/>

  <text x="185" y="420" class="section">RGB APPEARANCE BRANCH</text>
  <rect x="95" y="450" width="590" height="145" rx="22" fill="url(#rgb)" filter="url(#shadow)"/>
  <text x="390" y="502" text-anchor="middle" class="box-title">MobileNetV3-Large RGB Feature Extractor</text>
  <text x="390" y="535" text-anchor="middle" class="box-body">Learns hand shape, appearance, context, and spatial cues</text>
  <text x="390" y="565" text-anchor="middle" class="box-small">Output: 960-D feature vector per sampled frame</text>

  <text x="805" y="420" class="section">GEOMETRIC LANDMARK BRANCH</text>
  <rect x="715" y="450" width="590" height="145" rx="22" fill="url(#landmark)" filter="url(#shadow)"/>
  <text x="1010" y="494" text-anchor="middle" class="box-title">MediaPipe Holistic + Motion Encoding</text>
  <text x="1010" y="527" text-anchor="middle" class="box-body">Left hand (21) + right hand (21) + pose (33) landmarks</text>
  <text x="1010" y="555" text-anchor="middle" class="box-small">Normalization, validity mask, first/second-order motion</text>
  <text x="1010" y="580" text-anchor="middle" class="box-small">Landmark branch projects geometric features to 256-D</text>

  <path d="M390 595 V675 H685 V730" class="line"/>
  <path d="M1010 595 V675 H915 V730" class="line"/>
  <path d="M520 625 H880" class="dash"/>
  <text x="700" y="617" text-anchor="middle" class="box-small">complementary visual and motion evidence</text>

  <text x="575" y="705" class="section">MULTIMODAL FUSION</text>
  <rect x="480" y="730" width="720" height="130" rx="22" fill="url(#fusion)" filter="url(#shadow)"/>
  <text x="840" y="780" text-anchor="middle" class="box-title">Dynamic Reliability-Aware Fusion Gate</text>
  <text x="840" y="812" text-anchor="middle" class="box-body">Adapts RGB and landmark contribution when blur or occlusion occurs</text>
  <text x="840" y="840" text-anchor="middle" class="box-small">Fused temporal representation: 256-D per frame</text>

  <path d="M840 860 V910" class="line"/>

  <rect x="70" y="900" width="400" height="112" rx="22" fill="url(#temporal)" filter="url(#shadow)"/>
  <text x="270" y="943" text-anchor="middle" class="box-title">HMS Temporal Encoder</text>
  <text x="270" y="973" text-anchor="middle" class="box-small">Multi-scale sequence learning: T=32 to T=16 to T=8</text>

  <path d="M470 956 H570" class="line"/>
  <rect x="570" y="900" width="420" height="112" rx="22" fill="#344565" stroke="#96acd0" stroke-width="2" filter="url(#shadow)"/>
  <text x="780" y="943" text-anchor="middle" class="box-title">Mamba Block</text>
  <text x="780" y="973" text-anchor="middle" class="box-small">GRU-based fallback when native mamba_ssm is unavailable</text>

  <path d="M990 956 H1090" class="line"/>
  <rect x="1090" y="900" width="420" height="112" rx="22" fill="url(#output)" filter="url(#shadow)"/>
  <text x="1300" y="943" text-anchor="middle" class="box-title">Softmax Classifier</text>
  <text x="1300" y="973" text-anchor="middle" class="box-small">Top prediction + confidence + uncertainty threshold</text>

  <text x="800" y="1040" text-anchor="middle" class="foot">Training: PopSign Game videos | Test Top-1 Accuracy: 82.56% | GPU profile: 38.34 FPS</text>
</svg>
